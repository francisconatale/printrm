spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# SQLite Configuration
spring.datasource.url=jdbc:sqlite:studio.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Centralized Paths for Portable/Dev
# Use "." if running from backend/ folder, or "./backend" if running from root
studio.base-path=.

# Logging Configuration
logging.pattern.console=%clr(%d{HH:mm:ss.SSS}){faint} %clr(%5p) %clr(---){faint} %clr(%-35.35logger{35}){cyan} %clr(:){faint} %m%n%wEx{5}
logging.level.root=INFO
logging.level.org.hibernate=WARN
logging.level.org.springframework.web=WARN
logging.level.org.apache.tomcat=WARN
logging.level.org.sqlite=WARN
