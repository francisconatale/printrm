plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.0'
    id 'io.spring.dependency-management' version '1.1.5'
    id 'jacoco'
}

group = 'com.printly.studio'
version = '1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    implementation 'org.xerial:sqlite-jdbc:3.45.3.0'
    implementation 'org.hibernate.orm:hibernate-community-dialects:6.5.2.Final'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Cucumber
    testImplementation 'io.cucumber:cucumber-java:7.18.0'
    testImplementation 'io.cucumber:cucumber-spring:7.18.0'
    testImplementation 'io.cucumber:cucumber-junit-platform-engine:7.18.0'
    testImplementation 'org.junit.platform:junit-platform-suite:1.10.2'
    testImplementation 'com.h2database:h2'
}

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy jacocoTestReport

    testLogging {
        events "passed", "skipped", "failed", "standardOut", "standardError"
        exceptionFormat "full"
        showExceptions true
        showCauses true
        showStackTraces true
    }
}

jacoco {
    toolVersion = "0.8.12"
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        csv.required = false
        html.required = true
    }

    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: [
                '**/*DTO.class',
                '**/*RequestDTO.class',
                '**/*ResponseDTO.class',
                '**/config/**',
                '**/*Config.class',
                '**/*Constants.class',
                '**/*Application.class',
                '**/*SlicerController.class'
            ])
        }))
    }
}

jacocoTestCoverageVerification {
    violationRules {
        rule {
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.40
            }
            excludes = [
                '*.DTO.*',
                '*.RequestDTO.*',
                '*.ResponseDTO.*',
                '*.config.*',
                '*Config.*',
                '*Constants.*',
                '*Application.*',
                '*SlicerController.*'
            ]
        }
    }
}

// Stage task for later use in Electron
task stageApp(type: Copy) {
    dependsOn bootJar
    
    into "$buildDir/staging"
    
    // Copy the boot JAR into backend folder
    into("backend") {
        from(bootJar.archiveFile) {
            rename { "printly-backend.jar" }
        }
    }
    
    // Copy PrusaSlicer binaries into 'bin' folder
    into("bin") {
        from "$projectDir/bin"
    }

    // Copy configurations
    into("configs") {
        from "$projectDir/configs"
    }
}

// Minimal JRE generation using jlink
task generateJre(type: Exec) {
    def jlinkPath = "${System.getProperty('java.home')}/bin/jlink"
    def outputDir = "$buildDir/staging/backend/jre"
    
    doFirst {
        delete outputDir
    }
    
    commandLine jlinkPath,
        '--module-path', "${System.getProperty('java.home')}/jmods",
        '--add-modules', 'java.base,java.logging,java.naming,java.desktop,java.management,java.security.jgss,java.instrument,java.sql,jdk.unsupported',
        '--output', outputDir,
        '--strip-debug',
        '--no-man-pages',
        '--no-header-files',
        '--compress', '2'
}

stageApp.dependsOn generateJre
